name: Feature request
description: Propose an authorized development, testing, compatibility, or usability improvement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user or maintenance problem without prescribing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: authorization
    attributes:
      label: Responsible-use confirmation
      options:
        - label: This request is intended for software I own or am authorized to test.
          required: true
