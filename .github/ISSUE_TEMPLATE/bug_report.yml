name: Bug report
description: Report a reproducible Extreme Injector Ex defect.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach third-party binaries, credentials, or private material. Use only targets and DLLs you are authorized to test.

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 3.7.4 or commit SHA
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Target architecture
      options:
        - x64
        - x86
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - GUI
        - CLI
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the injection method and relevant settings, but redact private paths and names.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
